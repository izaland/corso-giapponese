<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pratica Hiragana</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/menu.css">
<style>
:root{--red:#b91c1c;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f8fafc}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px}
.topbar a{color:var(--red);font-weight:700;text-decoration:none}
.hero{background:linear-gradient(135deg,#7f1d1d,#b91c1c);color:#fff;padding:40px 20px;text-align:center}
.hero h1{margin:0 0 8px;font-size:clamp(28px,4vw,40px)}
.hero p{margin:0;opacity:.92}
.container{max-width:900px;margin:0 auto;padding:28px 20px 56px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
.panel h2{margin:0 0 12px;font-size:20px}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.lesson{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px}
.lesson input{width:18px;height:18px;accent-color:var(--red)}
.lesson label{font-weight:600}
.lesson small{display:block;color:var(--muted);font-weight:400}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.btn{padding:12px 18px;border-radius:12px;border:0;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn-primary{background:var(--red);color:#fff}
.btn-secondary{background:#fee2e2;color:var(--red)}
.hidden{display:none!important}
.quiz-kana{font-size:72px;text-align:center;font-weight:800}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.answer{padding:14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700;cursor:pointer}
.answer.correct{background:#dcfce7;border-color:#16a34a}
.answer.wrong{background:#fee2e2;color:var(--red)}
.feedback{min-height:24px;margin-top:12px;font-weight:700}
.progress{height:8px;background:#fee2e2;border-radius:999px;overflow:hidden;margin-bottom:16px}
.progress span{display:block;height:100%;background:var(--red);width:0}
.trace-box{position:relative;aspect-ratio:1;border:1px dashed var(--line);border-radius:16px;background:#fff;overflow:hidden}
.trace-guide{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;color:#f3f4f6;font-weight:800;pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<header class="topbar">
<div class="brand">Pratica Hiragana</div>
<a href="../index.html">Home</a>
</header>

<section class="hero">
<h1>Esercitazione Hiragana</h1>
<p>Scegli le lezioni da includere, poi fai pratica con quiz e tracing.</p>
</section>

<main class="container">
<section class="panel">
<h2>Scegli le lezioni</h2>
<div class="lessons">
<label class="lesson"><input type="checkbox" class="lesson-check" value="1" checked><span><label>Lezione 1</label><small>a, ka, sa</small></span></label>
<label class="lesson"><input type="checkbox" class="lesson-check" value="2"><span><label>Lezione 2</label><small>ta, na, ha, ma</small></span></label>
<label class="lesson"><input type="checkbox" class="lesson-check" value="3"><span><label>Lezione 3</label><small>ya, ra, wa, n</small></span></label>
</div>
<div class="actions">
<button class="btn btn-primary" id="startQuiz">Inizia il quiz</button>
<button class="btn btn-secondary" id="startTrace">Inizia il tracing</button>
</div>
</section>

<section class="panel hidden" id="quizPanel">
<div class="progress"><span id="quizProgress"></span></div>
<div id="quizQuestion"></div>
<div class="answers" id="quizAnswers"></div>
<div class="feedback" id="quizFeedback"></div>
<div class="actions"><button class="btn btn-primary hidden" id="quizNext">Avanti</button></div>
</section>

<section class="panel hidden" id="tracePanel">
<div class="progress"><span id="traceProgress"></span></div>
<div id="traceKana" style="font-size:64px;text-align:center;font-weight:800"></div>
<div style="text-align:center;color:var(--muted);margin-bottom:12px"><span id="traceRomaji"></span> · <span id="traceCounter"></span></div>
<div class="trace-box"><div class="trace-guide" id="traceGuide"></div><canvas id="traceCanvas"></canvas></div>
<div class="actions"><button class="btn btn-secondary" id="traceClear">Cancella</button><button class="btn btn-primary" id="traceNext">Prossima</button></div>
</section>
</main>

<script>
const KANA={
1:[['あ','a'],['い','i'],['う','u'],['え','e'],['お','o'],['か','ka'],['き','ki'],['く','ku'],['け','ke'],['こ','ko'],['さ','sa'],['し','shi'],['す','su'],['せ','se'],['そ','so']],
2:[['た','ta'],['ち','chi'],['つ','tsu'],['て','te'],['と','to'],['な','na'],['に','ni'],['ぬ','nu'],['ね','ne'],['の','no'],['は','ha'],['ひ','hi'],['ふ','fu'],['へ','he'],['ほ','ho'],['ま','ma'],['み','mi'],['む','mu'],['め','me'],['も','mo']],
3:[['や','ya'],['ゆ','yu'],['よ','yo'],['ら','ra'],['り','ri'],['る','ru'],['れ','re'],['ろ','ro'],['わ','wa'],['を','wo'],['ん','n']]
};
function selectedKana(){
const lessons=[...document.querySelectorAll('.lesson-check')].filter(c=>c.checked).map(c=>c.value);
return lessons.flatMap(l=>KANA[l].map(([k,r])=>({kana:k,romaji:r,lesson:l})));
}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
let quizItems=[],quizIndex=0,quizCorrect=0,answered=false;
function startQuiz(){
const pool=selectedKana();
if(!pool.length){alert('Seleziona almeno una lezione.');return;}
quizItems=shuffle(pool).slice(0,Math.min(10,pool.length));quizIndex=0;quizCorrect=0;
document.getElementById('quizPanel').classList.remove('hidden');
renderQuiz();
}
function renderQuiz(){
answered=false;const item=quizItems[quizIndex];
document.getElementById('quizProgress').style.width=(quizIndex/quizItems.length*100)+'%';
document.getElementById('quizFeedback').textContent='';
document.getElementById('quizNext').classList.add('hidden');
const q=document.getElementById('quizQuestion'),a=document.getElementById('quizAnswers');
a.innerHTML='';
const askKana=Math.random()<.5;
q.innerHTML=askKana?`<div class="quiz-kana">${item.kana}</div><p style="text-align:center;color:var(--muted)">Quale romaji corrisponde?</p>`:`<div class="quiz-kana">${item.romaji}</div><p style="text-align:center;color:var(--muted)">Quale hiragana corrisponde?</p>`;
const field=askKana?'romaji':'kana';
const options=shuffle([item,...pool.filter(x=>x[field]!==item[field]).slice(0,3)]);
options.forEach(o=>{const b=document.createElement('button');b.className='answer';b.textContent=o[field];b.onclick=()=>check(b,o[field],item[field]);a.appendChild(b);});
}
function check(button,chosen,correct){
if(answered)return;answered=true;
[...document.querySelectorAll('.answer')].forEach(b=>b.disabled=true);
if(chosen===correct){quizCorrect++;button.classList.add('correct');document.getElementById('quizFeedback').textContent='Corretto!';}
else{button.classList.add('wrong');document.getElementById('quizFeedback').textContent=`Non è corretto: la risposta era ${correct}`;}
document.getElementById('quizNext').classList.remove('hidden');
}
document.getElementById('quizNext').onclick=()=>{quizIndex++;quizIndex>=quizItems.length?alert(`Hai completato il quiz: ${quizCorrect}/${quizItems.length}`):renderQuiz();};
let traceItems=[],traceIndex=0,drawing=false,lastX=0,lastY=0;
const canvas=document.getElementById('traceCanvas'),ctx=canvas.getContext('2d');
function startTrace(){
traceItems=selectedKana();
if(!traceItems.length){alert('Seleziona almeno una lezione.');return;}
traceIndex=0;document.getElementById('tracePanel').classList.remove('hidden');renderTrace();
}
function renderTrace(){
const item=traceItems[traceIndex];
document.getElementById('traceProgress').style.width=(traceIndex/traceItems.length*100)+'%';
document.getElementById('traceKana').textContent=item.kana;
document.getElementById('traceRomaji').textContent=item.romaji;
document.getElementById('traceCounter').textContent=`${traceIndex+1}/${traceItems.length}`;
document.getElementById('traceGuide').textContent=item.kana;
resizeCanvas();clearCanvas();
}
function resizeCanvas(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#b91c1c';}
function clearCanvas(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);}
function point(e){const r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
canvas.addEventListener('pointerdown',e=>{drawing=true;const p=point(e);lastX=p.x;lastY=p.y;ctx.beginPath();ctx.moveTo(p.x,p.y);canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y;});
canvas.addEventListener('pointerup',()=>drawing=false);
canvas.addEventListener('pointercancel',()=>drawing=false);
document.getElementById('traceClear').onclick=clearCanvas;
document.getElementById('traceNext').onclick=()=>{traceIndex++;traceIndex>=traceItems.length?alert('Hai completato tutte le sillabe selezionate.'):renderTrace();};
document.getElementById('startQuiz').onclick=startQuiz;
document.getElementById('startTrace').onclick=startTrace;
window.addEventListener('resize',()=>{if(!document.getElementById('tracePanel').classList.contains('hidden'))resizeCanvas();});
</script>
</body>
</html>
